<!doctype html>
<html lang="sr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Koala">
<meta name="theme-color" content="#58afe8">
<title>Koala</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
  @font-face {
    font-family: "Pixel";
    src: url("font/latin.woff2") format("woff2");
    font-weight: 500;
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+20AC, U+2122, U+2212;
  }
  @font-face {
    font-family: "Pixel";
    src: url("font/latin-ext.woff2") format("woff2");
    font-weight: 500;
    unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+1E00-1E9F, U+2C60-2C7F, U+A720-A7FF;
  }
  :root {
    --ink: #3a3347;
    --paper: #fff7fa;
    --paper-shade: #f6d3df;
    --pink: #ff6f9a;
    --sat: env(safe-area-inset-top);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #1c2350;
    overscroll-behavior: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    font-family: "Pixel", ui-monospace, monospace;
    font-weight: 500;
  }
  #world {
    position: fixed;
    left: 0;
    top: 0;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    touch-action: none;
  }
  #bubble {
    position: fixed;
    left: 0;
    top: 0;
    max-width: min(260px, calc(100vw - 20px));
    padding: 9px 13px 10px;
    color: var(--ink);
    background: var(--paper);
    font-size: 16px;
    line-height: 1.25;
    box-shadow:
      0 -3px 0 0 var(--ink), 0 3px 0 0 var(--ink), -3px 0 0 0 var(--ink), 3px 0 0 0 var(--ink),
      inset 0 -3px 0 0 var(--paper-shade);
    opacity: 0;
    pointer-events: none;
    transform-origin: 50% 100%;
    will-change: transform;
  }
  #bubble.show { opacity: 1; animation: pop 0.22s steps(4) both; }
  #bubble::after {
    content: "";
    position: absolute;
    left: calc(var(--tail, 50%) - 7px);
    bottom: -9px;
    width: 15px;
    height: 9px;
    background:
      linear-gradient(var(--ink), var(--ink)) 0 0 / 3px 3px no-repeat,
      linear-gradient(var(--paper-shade), var(--paper-shade)) 3px 0 / 9px 3px no-repeat,
      linear-gradient(var(--ink), var(--ink)) 12px 0 / 3px 3px no-repeat,
      linear-gradient(var(--ink), var(--ink)) 3px 3px / 3px 3px no-repeat,
      linear-gradient(var(--paper-shade), var(--paper-shade)) 6px 3px / 3px 3px no-repeat,
      linear-gradient(var(--ink), var(--ink)) 9px 3px / 3px 3px no-repeat,
      linear-gradient(var(--ink), var(--ink)) 6px 6px / 3px 3px no-repeat;
  }
  #bubble-text::after { content: "\2665"; color: var(--pink); margin-left: 6px; }
  @keyframes pop { from { opacity: 0; scale: 0.6; } to { opacity: 1; scale: 1; } }
  #bar {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    display: flex;
    gap: 10px;
    justify-content: center;
    padding: 0 12px calc(14px + env(safe-area-inset-bottom));
    pointer-events: none;
  }
  #bar button {
    pointer-events: auto;
    flex: 1 1 0;
    max-width: 96px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    padding: 9px 2px 7px;
    border: 0;
    border-radius: 0;
    color: var(--ink);
    background: var(--paper);
    font: inherit;
    font-size: 13px;
    box-shadow:
      0 -3px 0 0 var(--ink), 0 3px 0 0 var(--ink), -3px 0 0 0 var(--ink), 3px 0 0 0 var(--ink),
      inset 0 -4px 0 0 var(--paper-shade), 0 7px 0 0 rgba(30, 20, 50, 0.25);
    touch-action: manipulation;
  }
  #bar button:active {
    transform: translateY(3px);
    box-shadow:
      0 -3px 0 0 var(--ink), 0 3px 0 0 var(--ink), -3px 0 0 0 var(--ink), 3px 0 0 0 var(--ink),
      inset 0 3px 0 0 var(--paper-shade);
  }
  #bar img { width: 27px; height: 24px; object-fit: contain; image-rendering: pixelated; }
  #hint {
    position: fixed;
    left: 12px;
    right: 12px;
    top: calc(env(safe-area-inset-top) + 12px);
    padding: 10px 40px 11px 12px;
    background: var(--paper);
    color: var(--ink);
    font-size: 14px;
    line-height: 1.3;
    box-shadow: 0 -3px 0 0 var(--ink), 0 3px 0 0 var(--ink), -3px 0 0 0 var(--ink), 3px 0 0 0 var(--ink);
  }
  #hint[hidden] { display: none; }
  #hint b { color: var(--pink); font-weight: 500; }
  #hint-close {
    position: absolute;
    right: 4px;
    top: 4px;
    width: 32px;
    height: 32px;
    border: 0;
    background: none;
    color: var(--ink);
    font: inherit;
    font-size: 18px;
  }
</style>
</head>
<body>
<canvas id="world"></canvas>
<div id="bubble" aria-live="polite"><span id="bubble-text"></span></div>
<div id="hint" hidden>
  Stavi me na početni ekran! U Safariju dodirni <b>Podeli</b>, pa <b>Dodaj na početni ekran</b>.
  <button id="hint-close" aria-label="Zatvori">×</button>
</div>
<nav id="bar">
  <button id="btn-feed"><img alt=""><span>Nahrani</span></button>
  <button id="btn-msg"><img alt=""><span>Poruka</span></button>
  <button id="btn-hug"><img alt=""><span>Zagrli me</span></button>
  <button id="btn-sleep"><img alt=""><span>Spavaj</span></button>
</nav>
<script src="sprite.js"></script>
<script src="messages.js"></script>
<script src="game.js"></script>
</body>
</html>
